# =============================================================================
# PHASE 6: API GATEWAY — HTTP API (ALL frontend routes via OpenAPI DefinitionBody)
# =============================================================================

  HttpApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/FSG-${Environment}-Comm-HttpApi
      RetentionInDays: 30

  HttpApiAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: HttpApiAuthorizerInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SecurityAuthService.Arn

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub FSG-${Environment}-Comm-HttpApi
      StageName: prod
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Site-Id
          - X-Allowed-Site-Ids
        MaxAge: 300
      Auth:
        DefaultAuthorizer: LambdaAuthorizer
        Authorizers:
          LambdaAuthorizer:
            FunctionArn: !GetAtt SecurityAuthService.Arn
            FunctionInvokeRole: !GetAtt HttpApiAuthorizerRole.Arn
            Identity:
              Headers: [Authorization]
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","routeKey":"$context.routeKey","status":"$context.status"}'
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: !Sub FSG-${Environment} API
          version: "1.0"
        paths:
          /health:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SiteConfigService.Arn}/invocations
                payloadFormatVersion: "2.0"
              security: []
          /sites:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SiteConfigService.Arn}/invocations
                payloadFormatVersion: "2.0"
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SiteConfigService.Arn}/invocations
                payloadFormatVersion: "2.0"
          /sites/{siteId}:
